services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_VERSION: reference-cnn-v1
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
